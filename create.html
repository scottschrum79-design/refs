<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CV Soccer | Referee Creator</title><link rel="stylesheet" href="styles.css?v=3"></head>
<body><header><h1>Referee Signup Creator</h1><p>Conestoga Valley Soccer</p></header>
<main><section id="login-card" class="card narrow"><h2>Creator Access</h2><form id="login-form" class="stack"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="primary">Sign In</button><p id="login-status" class="status"></p></form></section>
<div id="creator-content" hidden><section class="card"><h2>Create Games</h2><form id="game-form" class="grid"><label>Date<input name="gameDate" type="date" required></label><label>Game start time<input name="startTime" type="time" required></label><label>Average length (minutes)<input name="duration" type="number" min="10" max="180" value="40" required></label><label>Age group<input name="ageGroup" value="U8" required maxlength="20"></label><label>Location<input name="location" required maxlength="100"></label><label>Number of simultaneous games<input name="gameCount" type="number" min="1" max="20" value="1" required></label><label class="wide">Field numbers/names (separate with commas)<input name="fields" placeholder="Field 1, Field 2, Field 3"><small>If blank, openings are labeled Game 1, Game 2, etc.</small></label><label class="wide">Public notes (optional)<textarea name="publicNotes" rows="2" maxlength="500"></textarea></label><button class="primary wide" type="submit">Create Referee Openings</button><p id="creator-status" class="status wide"></p></form></section>
<section class="card"><div class="title-row"><div><h2>Organizer View</h2><p>Full parent and referee details are visible only here.</p></div><button id="download-report" class="secondary">Download Referee Report</button></div><div id="admin-games" class="games"></div></section></div></main>
<footer><nav class="footer-nav" aria-label="Site administration"><a href="index.html">Signup Page</a><a class="active" href="create.html">Creator Page</a><button id="signout" class="navbutton" hidden>Sign out</button></nav></footer>
<dialog id="edit-dialog"><form id="edit-form" class="modal"><button type="button" class="close">×</button><h2>Edit Game</h2><input type="hidden" name="id"><div class="grid"><label>Date<input name="gameDate" type="date" required></label><label>Start time<input name="startTime" type="time" required></label><label>Length (minutes)<input name="duration" type="number" min="10" max="180" required></label><label>Age group<input name="ageGroup" required></label><label>Location<input name="location" required></label><label>Field<input name="fieldName" required></label><label class="wide">Public notes<textarea name="publicNotes"></textarea></label><label><input name="isOpen" type="checkbox"> Signup open</label></div><button class="primary">Save Changes</button></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="config.js?v=5"></script><script src="shared.js?v=5"></script><script src="creator.js?v=5"></script></body></html>
