<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CV Soccer | Youth Referee Signup</title><link rel="stylesheet" href="styles.css?v=3"></head>
<body><header><h1>Youth Referee Signups</h1><p>Conestoga Valley Soccer</p></header>
<main><section class="card"><h2>Available Games</h2><p class="intro">Parents: choose a game below to register your 12–16-year-old referee. A child may referee multiple games as long as the game times do not overlap.</p><p id="status" class="status">Loading available games…</p><div id="games" class="games"></div></section></main>
<footer><nav class="footer-nav" aria-label="Site administration"><a class="active" href="index.html">Signup Page</a><a href="create.html">Creator Page</a></nav></footer>
<dialog id="signup-dialog"><form id="signup-form" class="modal"><button type="button" class="close" aria-label="Close">×</button><h2>Referee Signup</h2><p id="selected-game" class="selected"></p><input type="hidden" name="gameId"><div class="grid"><label>Child's first name<input name="childFirst" required maxlength="50"></label><label>Child's last name<input name="childLast" required maxlength="50"></label><label>Child's age<input name="childAge" type="number" min="12" max="16" required></label><span></span><label>Parent's first name<input name="parentFirst" required maxlength="50"></label><label>Parent's last name<input name="parentLast" required maxlength="50"></label><label>Parent's email<input name="parentEmail" type="email" required></label><label>Parent's cellphone<input name="parentPhone" type="tel" required></label></div><label>Notes (optional)<textarea name="notes" rows="3" maxlength="500"></textarea></label><button class="primary" type="submit">Sign Up My Child</button><p id="form-status" class="status"></p></form></dialog>
<script src="config.js"></script><script src="shared.js"></script><script src="public.js"></script></body></html>
